services:
  mongo:
    image: mongo:latest
    environment:
      GLIBC_TUNABLES: glibc.pthread.rseq=1
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    command:
      - --replSet=rs0
      - --bind_ip_all
      - --storageEngine=wiredTiger
    volumes:
      - mongo:/data/db
    restart: on-failure
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 2s
      timeout: 5s
      retries: 30

  mongo-init:
    image: mongo:latest
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - /bin/sh
      - -lc
      - |
        set -eu
        i=0
        while [ "$$i" -lt 30 ]; do
          if mongosh --host mongo --quiet --eval '
            try {
              if (rs.status().ok) quit(0);
            } catch (e) {}
            rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mongo:27017" }] });
          '; then
            exit 0
          fi
          i=$$((i + 1))
          sleep 2
        done
        echo "mongo-init: replica set not ready after retries" >&2
        exit 1

  silo:
    image: docker.io/pgsty/silo:RELEASE.2026-09-03T13-18-01Z
    ports:
      - "127.0.0.1:${SILO_PORT:-9000}:9000"
      - "127.0.0.1:${SILO_CONSOLE_PORT:-9100}:9001"
    environment:
      SILO_ROOT_USER: ${S3_ACCESS_KEY_ID:-siloadmin}
      SILO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-silo-local-dev}
    volumes:
      - silo:/data
      - ./devenv/silo-entrypoint.sh:/usr/local/bin/silo-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/silo-entrypoint.sh"]
    command: ["server", "/data", "--console-address", ":9001"]
    healthcheck:
      test: ["CMD", "silo", "healthcheck", "ready"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 3s

  createbuckets:
    image: docker.io/pgsty/silo:RELEASE.2026-09-03T13-18-01Z
    depends_on:
      silo:
        condition: service_healthy
    restart: "no"
    environment:
      SILO_ROOT_USER: ${S3_ACCESS_KEY_ID:-siloadmin}
      SILO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-silo-local-dev}
      S3_BUCKET: ${S3_BUCKET:-shunkan}
      S3_PRIVATE_BUCKET: ${S3_PRIVATE_BUCKET:-shunkan-private}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        i=0
        until mcli alias set local http://silo:9000 "$$SILO_ROOT_USER" "$$SILO_ROOT_PASSWORD"; do
          i=$$((i + 1))
          if [ "$$i" -ge 30 ]; then
            echo "createbuckets: silo not ready" >&2
            exit 1
          fi
          sleep 1
        done
        mcli mb --ignore-existing "local/$$S3_BUCKET"
        mcli anonymous set download "local/$$S3_BUCKET"
        mcli mb --ignore-existing "local/$$S3_PRIVATE_BUCKET"
        mcli anonymous set none "local/$$S3_PRIVATE_BUCKET"

volumes:
  mongo:
  silo:
